<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fff6f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Adesivos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icone-192.png" />
    <link rel="apple-touch-icon" href="./icone-180.png" />
    <title>Cantinho de adesivos</title>
  </head>
  <body>
    <div id="app">
      <header class="topo">
        <nav id="fases" class="fases" role="tablist" aria-label="Fases"></nav>
      </header>

      <main id="palco" class="palco">
        <div class="acoes">
          <button id="btn-desfazer" class="icone" type="button" aria-label="Desfazer" title="Desfazer (Ctrl+Z)" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          </button>
          <button id="btn-refazer" class="icone" type="button" aria-label="Refazer" title="Refazer (Ctrl+Shift+Z)" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
          </button>
          <span class="acoes-espaco" aria-hidden="true"></span>
          <button id="btn-foto" class="icone" type="button" aria-label="Salvar foto do cômodo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.2-1.8c.3-.4.7-.7 1.2-.7h3.8c.5 0 .9.3 1.2.7L16.3 6h1.2A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.4" r="3.4"/></svg>
          </button>
          <button id="btn-limpar" class="icone" type="button" aria-label="Limpar cômodo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5.2c0-.7.5-1.2 1.2-1.2h1.6c.7 0 1.2.5 1.2 1.2V7M6.5 7l.8 11.3c.1 1 .9 1.7 1.9 1.7h5.6c1 0 1.8-.7 1.9-1.7L17.5 7M10.2 10.5v6M13.8 10.5v6"/></svg>
          </button>
        </div>
        <div class="zoom" role="group" aria-label="Zoom do cômodo">
          <button id="btn-aproximar" class="icone" type="button" aria-label="Aproximar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6M11 8v6M16 16l4 4"/></svg>
          </button>
          <button id="btn-afastar" class="icone" type="button" aria-label="Afastar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6M16 16l4 4"/></svg>
          </button>
          <button id="btn-ver-tudo" class="icone" type="button" aria-label="Ver o cômodo inteiro" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.5C4 4.7 4.7 4 5.5 4H9M15 4h3.5c.8 0 1.5.7 1.5 1.5V9M20 15v3.5c0 .8-.7 1.5-1.5 1.5H15M9 20H5.5C4.7 20 4 19.3 4 18.5V15"/></svg>
          </button>
        </div>
        <div id="mundo" class="mundo">
          <img id="comodo" class="comodo" alt="" draggable="false" />
          <div id="colados" class="colados"></div>
        </div>
        <p id="dica" class="dica" hidden>Arraste um adesivo<br />lá de baixo pro cômodo</p>
        <div id="ferramentas" class="ferramentas" hidden>
          <button type="button" data-acao="espelhar" data-so-solto>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M9 7 4 17h5zM15 7l5 10h-5z"/></svg>
            Virar
          </button>
          <button type="button" data-acao="menor" data-so-solto>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l5.5 5.5M9.5 5v4.5H5M20 20l-5.5-5.5M14.5 19v-4.5H19"/></svg>
            Menor
          </button>
          <button type="button" data-acao="maior" data-so-solto>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 9.5 4 4M4 8.5V4h4.5M14.5 14.5 20 20M20 15.5V20h-4.5"/></svg>
            Maior
          </button>
          <button type="button" data-acao="tras">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="11" height="11" rx="2.5"/><path d="M15 17.5v.5a2.5 2.5 0 0 1-2.5 2.5h-6A2.5 2.5 0 0 1 4 18v-6a2.5 2.5 0 0 1 2.5-2.5H7"/></svg>
            Pra trás
          </button>
          <button type="button" data-acao="fixar" aria-pressed="false">
            <svg class="se-solto" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6M10 4v5.5L7 13h10l-3-3.5V4M12 13v7"/></svg>
            <svg class="se-fixo" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6M10 4v5.5L7 13h10l-3-3.5V4M12 13v7M4 4l16 16"/></svg>
            <span class="se-solto">Fixar</span>
            <span class="se-fixo">Soltar</span>
          </button>
          <button type="button" data-acao="tirar" data-so-solto>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            Tirar
          </button>
        </div>
      </main>

      <section id="paleta" class="paleta" aria-label="Adesivos disponíveis">
        <div id="paleta-trilho" class="paleta-trilho"></div>
        <p class="paleta-soltar" aria-hidden="true">Solte aqui pra descolar</p>
      </section>
    </div>

    <dialog id="dialogo-limpar" class="dialogo">
      <form method="dialog">
        <p>Descolar todos os adesivos deste cômodo?</p>
        <div class="dialogo-botoes">
          <button value="nao" type="submit" class="secundario">Deixar como está</button>
          <button value="sim" type="submit" class="primario">Descolar tudo</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
